<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <title>VR Whack-a-Mole Game</title>
</head>
<body>
    <a-scene background="color: #87CEEB" vr-mode-ui="enabled: true">
        <!-- Game Instructions (shown at start) -->
        <a-entity id="instructions" position="0 2 -3">
            <a-text value="VR WHACK-A-MOLE" position="0 1.5 0" align="center" color="black" scale="3 3 3"></a-text>
            <a-text value="HOW TO PLAY:" position="0 1 0" align="center" color="darkblue" scale="2 2 2"></a-text>
            <a-text value="• Look at moles and click to hit them" position="0 0.5 0" align="center" color="black" scale="1.5 1.5 1.5"></a-text>
            <a-text value="• Hit moles when they pop up for points" position="0 0.2 0" align="center" color="black" scale="1.5 1.5 1.5"></a-text>
            <a-text value="• You have 30 seconds to play" position="0 -0.1 0" align="center" color="black" scale="1.5 1.5 1.5"></a-text>
            
            <a-text value="WIN: Score 100+ points" position="0 -0.7 0" align="center" color="green" scale="2 2 2"></a-text>
            <a-text value="LOSE: Score under 100" position="0 -1 0" align="center" color="red" scale="2 2 2"></a-text>
            
            <a-text value="PRESS SPACEBAR TO START!" position="0 -1.5 0" align="center" color="purple" scale="2 2 2"
                    animation="property: scale; to: 2.2 2.2 2.2; dur: 1000; dir: alternate; loop: true"></a-text>
        </a-entity>

        <!-- Game UI (hidden initially) -->
        <a-entity id="gameUI" visible="false">
            <a-text id="score" value="Score: 0" position="-2 3 -3" color="black" scale="2 2 2"></a-text>
            <a-text id="timer" value="Time: 30" position="2 3 -3" color="black" scale="2 2 2"></a-text>
            <a-text id="target" value="Target: 100 points to WIN!" position="0 3 -3" align="center" color="purple" scale="1.5 1.5 1.5"></a-text>
        </a-entity>
        
        <!-- Ground -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#4CC417"></a-plane>
        
        <!-- Mole holes -->
        <a-cylinder position="-2 0.01 -2" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        <a-cylinder position="0 0.01 -2" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        <a-cylinder position="2 0.01 -2" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        <a-cylinder position="-2 0.01 -4" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        <a-cylinder position="0 0.01 -4" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        <a-cylinder position="2 0.01 -4" radius="0.5" height="0.02" color="#8B4513"></a-cylinder>
        
        <!-- Moles -->
        <a-box id="mole1" class="mole" position="-2 -1 -2" width="0.8" height="0.8" depth="0.8" color="#8B4513" 
               animation__pop="property: position; to: -2 0.5 -2; dur: 300; startEvents: popup"
               animation__hide="property: position; to: -2 -1 -2; dur: 300; startEvents: hidedown">
        </a-box>
        
        <a-sphere id="mole2" class="mole" position="0 -1 -2" radius="0.4" color="#654321"
                  animation__pop="property: position; to: 0 0.5 -2; dur: 300; startEvents: popup"
                  animation__hide="property: position; to: 0 -1 -2; dur: 300; startEvents: hidedown">
        </a-sphere>
        
        <a-box id="mole3" class="mole" position="2 -1 -2" width="0.8" height="0.8" depth="0.8" color="#A0522D"
               animation__pop="property: position; to: 2 0.5 -2; dur: 300; startEvents: popup"
               animation__hide="property: position; to: 2 -1 -2; dur: 300; startEvents: hidedown">
        </a-box>
        
        <a-sphere id="mole4" class="mole" position="-2 -1 -4" radius="0.4" color="#8B4513"
                  animation__pop="property: position; to: -2 0.5 -4; dur: 300; startEvents: popup"
                  animation__hide="property: position; to: -2 -1 -4; dur: 300; startEvents: hidedown">
        </a-sphere>
        
        <a-box id="mole5" class="mole" position="0 -1 -4" width="0.8" height="0.8" depth="0.8" color="#654321"
               animation__pop="property: position; to: 0 0.5 -4; dur: 300; startEvents: popup"
               animation__hide="property: position; to: 0 -1 -4; dur: 300; startEvents: hidedown">
        </a-box>
        
        <a-sphere id="mole6" class="mole" position="2 -1 -4" radius="0.4" color="#A0522D"
                  animation__pop="property: position; to: 2 0.5 -4; dur: 300; startEvents: popup"
                  animation__hide="property: position; to: 2 -1 -4; dur: 300; startEvents: hidedown">
        </a-sphere>

        <!-- Camera -->
        <a-entity id="rig" position="0 1.6 1">
            <a-camera look-controls wasd-controls>
                <a-cursor color="red" raycaster="objects: .mole"></a-cursor>
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        // Game variables
        let score = 0;
        let timeLeft = 30;
        let gameRunning = false;
        let gameStarted = false;
        let activeMoles = [];
        const WINNING_SCORE = 100;
        let audioContext;
        
        // Audio functions
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playHitSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }
        
        function playVictorySound() {
            if (!audioContext) return;
            const notes = [523, 659, 784, 1047, 1319, 1568];
            notes.forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.2);
                gainNode.gain.setValueAtTime(0, audioContext.currentTime + i * 0.2);
                gainNode.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + i * 0.2 + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.2 + 0.3);
                oscillator.start(audioContext.currentTime + i * 0.2);
                oscillator.stop(audioContext.currentTime + i * 0.2 + 0.3);
            });
        }
        
        function playLoseSound() {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1);
        }
        
        // SPACEBAR to start - This will definitely work!
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' && !gameStarted) {
                event.preventDefault();
                initAudio();
                document.getElementById('instructions').setAttribute('visible', 'false');
                document.getElementById('gameUI').setAttribute('visible', 'true');
                startGame();
            }
        });
        
        // Set up mole click handlers after scene loads
        setTimeout(() => {
            document.querySelectorAll('.mole').forEach(mole => {
                mole.addEventListener('click', function() {
                    hitMole(this);
                });
            });
        }, 2000);
        
        // Game functions
        function startGame() {
            console.log('Game started!');
            gameRunning = true;
            gameStarted = true;
            score = 0;
            timeLeft = 30;
            updateDisplay();
            
            const gameTimer = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    endGame();
                }
            }, 1000);
            
            spawnMoles();
        }
        
        function spawnMoles() {
            if (!gameRunning) return;
            const delay = Math.random() * 2000 + 1000;
            setTimeout(() => {
                if (gameRunning) {
                    popRandomMole();
                    spawnMoles();
                }
            }, delay);
        }
        
        function popRandomMole() {
            const moles = document.querySelectorAll('.mole');
            const availableMoles = Array.from(moles).filter(mole => !activeMoles.includes(mole));
            if (availableMoles.length === 0) return;
            
            const randomMole = availableMoles[Math.floor(Math.random() * availableMoles.length)];
            activeMoles.push(randomMole);
            randomMole.emit('popup');
            
            setTimeout(() => {
                if (activeMoles.includes(randomMole)) {
                    hideMole(randomMole);
                }
            }, 2000);
        }
        
        function hideMole(mole) {
            mole.emit('hidedown');
            activeMoles = activeMoles.filter(m => m !== mole);
        }
        
        function hitMole(mole) {
            if (activeMoles.includes(mole)) {
                score += 10;
                updateDisplay();
                hideMole(mole);
                playHitSound();
                
                const originalColor = mole.getAttribute('color');
                mole.setAttribute('color', 'red');
                setTimeout(() => {
                    mole.setAttribute('color', originalColor);
                }, 200);
            }
        }
        
        function updateDisplay() {
            document.getElementById('score').setAttribute('value', `Score: ${score}`);
            document.getElementById('timer').setAttribute('value', `Time: ${timeLeft}`);
            
            const remaining = Math.max(0, WINNING_SCORE - score);
            const targetDisplay = document.getElementById('target');
            if (remaining > 0) {
                targetDisplay.setAttribute('value', `Need ${remaining} more points to WIN!`);
                targetDisplay.setAttribute('color', 'purple');
            } else {
                targetDisplay.setAttribute('value', `TARGET REACHED! You're winning!`);
                targetDisplay.setAttribute('color', 'green');
            }
        }
        
        function endGame() {
            gameRunning = false;
            activeMoles = [];
            
            document.querySelectorAll('.mole').forEach(mole => {
                mole.emit('hidedown');
            });
            
            setTimeout(() => {
                let message;
                if (score >= WINNING_SCORE) {
                    playVictorySound();
                    message = `🎉 YOU WIN! 🎉\nFinal Score: ${score}\nYou reached the target!`;
                } else {
                    playLoseSound();
                    message = `😔 YOU LOSE 😔\nFinal Score: ${score}\nYou needed ${WINNING_SCORE} points to win.`;
                }
                
                alert(message);
                gameStarted = false;
                document.getElementById('instructions').setAttribute('visible', 'true');
                document.getElementById('gameUI').setAttribute('visible', 'false');
            }, 1000);
        }
    </script>
</body>
</html>
