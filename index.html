<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Sky -->
        <a-sky color="#2C2C2C"></a-sky>
        
        <!-- Player camera -->
        <a-entity id="player" position="0 1.6 3">
            <a-camera look-controls wasd-controls>
                <a-cursor color="white" opacity="0.8" scale="0.5 0.5 0.5"></a-cursor>
            </a-camera>
        </a-entity>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#404040"></a-light>
        <a-light type="point" position="0 4 0" color="#FFFFFF" intensity="0.8"></a-light>
        
        <!-- LEVEL 1: BASIC ROOM -->
        <a-entity id="level1" visible="true">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#8B4513"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -5" rotation="0 0 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="0 2.5 5" rotation="0 180 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="-5 2.5 0" rotation="0 90 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="5 2.5 0" rotation="0 -90 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="0 5 0" rotation="90 0 0" width="10" height="10" color="#696969"></a-plane>
            
            <!-- Table with Key -->
            <a-entity id="table1" position="2 0 -3">
                <a-box width="2" height="0.8" depth="1" color="#8B4513"></a-box>
                <a-cylinder id="key1" position="0 0.5 0" radius="0.1" height="0.5" color="#FFD700"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                    <a-sphere position="0 0.3 0" radius="0.15" color="#FFD700"></a-sphere>
                </a-cylinder>
            </a-entity>
            
            <!-- Chest -->
            <a-entity id="chest1" position="-3 0 -2">
                <a-box id="chest-base1" width="1.5" height="0.8" depth="1" color="#654321"></a-box>
                <a-box id="chest-lid1" position="0 0.6 -0.2" width="1.6" height="0.3" depth="1.1" color="#8B4513"></a-box>
                <a-cylinder id="chest-lock1" position="0 0.5 0.5" radius="0.1" height="0.2" color="#C0C0C0"></a-cylinder>
                <a-text id="note1" position="0 1.5 0" value="Code: 123\nGo to Level 2!" 
                        color="yellow" scale="0.8 0.8 0.8" visible="false"></a-text>
            </a-entity>
            
            <!-- Portal to Level 2 -->
            <a-entity id="portal1" position="0 1.25 4.5" visible="false">
                <a-cylinder radius="0.8" height="2.5" color="#00FF00" opacity="0.7"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-cylinder>
                <a-text position="0 0 0.9" value="LEVEL 2" color="white" scale="1 1 1"></a-text>
            </a-entity>
        </a-entity>

        <!-- LEVEL 2: LABORATORY -->
        <a-entity id="level2" visible="false">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#2F2F2F"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -6" rotation="0 0 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="0 2.5 6" rotation="0 180 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="-6 2.5 0" rotation="0 90 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="6 2.5 0" rotation="0 -90 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="0 5 0" rotation="90 0 0" width="12" height="12" color="#1A1A1A"></a-plane>
            
            <!-- Lab Table with Potions -->
            <a-entity id="lab-table2" position="0 0 -4">
                <a-box width="3" height="0.8" depth="1.5" color="#FFFFFF"></a-box>
                <a-cylinder id="red-potion" position="-1 0.6 0" radius="0.2" height="0.8" color="#FF0000"></a-cylinder>
                <a-cylinder id="blue-potion" position="0 0.6 0" radius="0.2" height="0.8" color="#0000FF"></a-cylinder>
                <a-cylinder id="green-potion" position="1 0.6 0" radius="0.2" height="0.8" color="#00FF00"></a-cylinder>
            </a-entity>
            
            <!-- Computer -->
            <a-entity id="computer2" position="3 1 -3">
                <a-box width="1.5" height="1" depth="0.1" color="#000000"></a-box>
                <a-text id="screen2" position="0 0 0.06" value="Mix potions in order:\nRED + BLUE + GREEN" 
                        color="#00FF00" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            
            <!-- Mixing Bowl -->
            <a-cylinder id="mixing-bowl2" position="0 0.5 -2" radius="0.4" height="0.3" color="#C0C0C0"></a-cylinder>
            
            <!-- Portal to Level 3 -->
            <a-entity id="portal2" position="0 1.25 5.5" visible="false">
                <a-cylinder radius="0.8" height="2.5" color="#FF00FF" opacity="0.7"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-cylinder>
                <a-text position="0 0 0.9" value="LEVEL 3" color="white" scale="1 1 1"></a-text>
            </a-entity>
        </a-entity>

        <!-- LEVEL 3: SPACE STATION -->
        <a-entity id="level3" visible="false">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#1a1a2e"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -7" rotation="0 0 0" width="14" height="5" color="#16213e"></a-plane>
            <a-plane position="0 2.5 7" rotation="0 180 0" width="14" height="5" color="#16213e"></a-plane>
            <a-plane position="-7 2.5 0" rotation="0 90 0" width="14" height="5" color="#16213e"></a-plane>
            <a-plane position="7 2.5 0" rotation="0 -90 0" width="14" height="5" color="#16213e"></a-plane>
            <a-plane position="0 5 0" rotation="90 0 0" width="14" height="14" color="#0f3460"></a-plane>
            
            <!-- Power Button -->
            <a-entity id="power-station" position="0 1.5 -5">
                <a-box width="2" height="1" depth="0.3" color="#2a2a2a"></a-box>
                <a-sphere id="power-button" position="0 -0.2 0.2" radius="0.2" color="#FF0000"
                         animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000"></a-sphere>
                <a-text position="0 0.3 0.2" value="POWER: OFF" color="#FF0000" scale="0.5 0.5 0.5"></a-text>
            </a-entity>
            
            <!-- Reactor Core -->
            <a-cylinder id="reactor3" position="0 1 0" radius="1" height="2" color="#0066cc" opacity="0.3" visible="false"></a-cylinder>
            
            <!-- Control Panel -->
            <a-entity id="control-panel3" position="3 1 3">
                <a-box width="2" height="1" depth="0.5" color="#333333"></a-box>
                <a-sphere id="launch-button" position="0 -0.2 0.3" radius="0.15" color="#00FF00" visible="false"></a-sphere>
                <a-text position="0 0.2 0.3" value="LAUNCH READY" color="#00FF00" scale="0.4 0.4 0.4" visible="false"></a-text>
            </a-entity>
            
            <!-- Final Portal -->
            <a-entity id="final-portal" position="0 1.25 6" visible="false">
                <a-cylinder radius="1" height="3" color="#FFD700" opacity="0.8"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
                <a-text position="0 0 1.1" value="VICTORY!" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
        
        <!-- UI Elements -->
        <a-text id="instructions" position="-3 4 -2" value="MULTI-LEVEL ESCAPE ROOM" color="white" scale="1.2 1.2 1.2"></a-text>
        <a-text id="hint" position="-2 3.5 -2" value="Level 1: Find the golden key!" color="yellow" scale="1 1 1"></a-text>
        <a-text id="level-display" position="2 3.5 -2" value="LEVEL: 1" color="lightblue" scale="1 1 1"></a-text>
        
    </a-scene>

    <script>
        // Game state
        let gameState = {
            currentLevel: 1,
            level1: { hasKey: false, chestOpened: false },
            level2: { potionsMixed: 0, correctOrder: ['red', 'blue', 'green'], mixedOrder: [] },
            level3: { powerOn: false, reactorActive: false }
        };

        // LEVEL 1 INTERACTIONS
        document.querySelector('#key1').addEventListener('click', function() {
            if (!gameState.level1.hasKey) {
                gameState.level1.hasKey = true;
                this.setAttribute('visible', 'false');
                updateHint("Great! Now find something to unlock with the key!");
            }
        });

        document.querySelector('#chest-base1').addEventListener('click', function() {
            if (gameState.level1.hasKey && !gameState.level1.chestOpened) {
                gameState.level1.chestOpened = true;
                document.querySelector('#chest-lock1').setAttribute('visible', 'false');
                document.querySelector('#chest-lid1').setAttribute('animation', 'property: rotation; to: -45 0 0; dur: 1000');
                
                setTimeout(() => {
                    document.querySelector('#note1').setAttribute('visible', 'true');
                    document.querySelector('#portal1').setAttribute('visible', 'true');
                    updateHint("Level 1 complete! Enter the green portal for Level 2!");
                }, 1000);
            } else if (!gameState.level1.hasKey) {
                updateHint("This chest is locked. Find a key first!");
            }
        });

        document.querySelector('#portal1').addEventListener('click', function() {
            if (gameState.level1.chestOpened) {
                switchToLevel(2);
            }
        });

        // LEVEL 2 INTERACTIONS
        document.querySelector('#red-potion').addEventListener('click', function() {
            if (gameState.currentLevel === 2) {
                addPotion('red');
            }
        });

        document.querySelector('#blue-potion').addEventListener('click', function() {
            if (gameState.currentLevel === 2) {
                addPotion('blue');
            }
        });

        document.querySelector('#green-potion').addEventListener('click', function() {
            if (gameState.currentLevel === 2) {
                addPotion('green');
            }
        });

        function addPotion(color) {
            gameState.level2.mixedOrder.push(color);
            gameState.level2.potionsMixed++;
            
            // Change mixing bowl color
            const colors = { red: '#FF0000', blue: '#0000FF', green: '#00FF00' };
            if (gameState.level2.potionsMixed === 1) {
                document.querySelector('#mixing-bowl2').setAttribute('color', colors[color]);
            } else if (gameState.level2.potionsMixed === 2) {
                document.querySelector('#mixing-bowl2').setAttribute('color', '#800080'); // Purple mix
            } else if (gameState.level2.potionsMixed === 3) {
                checkPotionOrder();
            }
        }

        function checkPotionOrder() {
            const correct = JSON.stringify(gameState.level2.mixedOrder) === JSON.stringify(gameState.level2.correctOrder);
            
            if (correct) {
                document.querySelector('#mixing-bowl2').setAttribute('color', '#FFD700'); // Gold
                document.querySelector('#portal2').setAttribute('visible', 'true');
                updateHint("Perfect mix! Portal to Level 3 is open!");
            } else {
                // Reset
                gameState.level2.mixedOrder = [];
                gameState.level2.potionsMixed = 0;
                document.querySelector('#mixing-bowl2').setAttribute('color', '#C0C0C0');
                updateHint("Wrong order! Try again: RED + BLUE + GREEN");
            }
        }

        document.querySelector('#portal2').addEventListener('click', function() {
            switchToLevel(3);
        });

        // LEVEL 3 INTERACTIONS
        document.querySelector('#power-button').addEventListener('click', function() {
            if (gameState.currentLevel === 3 && !gameState.level3.

    </script>
</body>
</html>
