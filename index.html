<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <title>Advanced Target Practice Game</title>
    <style>
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #startButton {
            padding: 20px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #startButton:hover {
            background: #45a049;
        }
        
        .game-title {
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .instructions {
            color: white;
            font-size: 18px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen">
        <h1 class="game-title">🎯 Target Practice Game</h1>
        <div class="instructions">
            <p>Look at targets to shoot them!</p>
            <p>Green=10pts • Orange=20pts • Red=30pts</p>
            <p>Purple Ring=40pts • Gold=50pts</p>
            <p>Build combos for bonus points!</p>
            <p><strong>🔥 Reach 100 points to face the FINAL BOSS! 🔥</strong></p>
        </div>
        <button id="startButton">START GAME</button>
    </div>

    <a-scene id="gameScene" style="display: none;">
        <!-- Sky background -->
        <a-sky id="gameSky" color="#001122"></a-sky>
        
        <!-- Camera with cursor for aiming -->
        <a-camera>
            <a-cursor color="red" 
                      raycaster="objects: .target, .boss"
                      fuse="true" 
                      fuse-timeout="800">
            </a-cursor>
        </a-camera>
        
        <!-- Regular Targets -->
        <a-entity id="regularTargets">
            <!-- Easy target - slow horizontal movement -->
            <a-sphere class="target" 
                      position="-6 2 -5" 
                      radius="0.5" 
                      color="green"
                      sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                      animation="property: position; 
                                to: 6 2 -5; 
                                dur: 8000; 
                                dir: alternate; 
                                loop: true; 
                                easing: linear">
            </a-sphere>
            
            <!-- Medium target - figure-8 pattern -->
            <a-sphere class="target" 
                      position="0 2 -6" 
                      radius="0.4" 
                      color="orange"
                      sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                      animation__x="property: position; 
                                  to: 3 2 -6; 
                                  dur: 2000; 
                                  dir: alternate; 
                                  loop: true; 
                                  easing: easeInOutSine"
                      animation__y="property: position; 
                                  to: 0 4 -6; 
                                  dur: 4000; 
                                  dir: alternate; 
                                  loop: true; 
                                  easing: easeInOutSine">
            </a-sphere>
            
            <!-- Hard target - circular motion + shrinking -->
            <a-entity id="circleTarget" position="0 2 -4">
                <a-sphere class="target" 
                          position="2 0 0" 
                          radius="0.6" 
                          color="red"
                          sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                          animation__shrink="property: radius; 
                                            to: 0.2; 
                                            dur: 3000; 
                                            dir: alternate; 
                                            loop: true; 
                                            easing: linear">
                </a-sphere>
            </a-entity>
            
            <!-- Ring targets that move in different patterns -->
            <a-torus class="target" 
                     position="4 3 -7" 
                     radius="0.5" 
                     radius-tubular="0.1" 
                     color="purple"
                     sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                     animation__bounce="property: position; 
                                       to: 4 1 -7; 
                                       dur: 1500; 
                                       dir: alternate; 
                                       loop: true; 
                                       easing: easeInOutBounce"
                     animation__spin="property: rotation; 
                                     to: 0 360 0; 
                                     dur: 2000; 
                                     loop: true; 
                                     easing: linear">
            </a-torus>
            
            <!-- Bonus fast target -->
            <a-sphere class="target bonus" 
                      position="-4 1 -3" 
                      radius="0.3" 
                      color="gold"
                      sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                      animation="property: position; 
                                to: 4 4 -8; 
                                dur: 1200; 
                                dir: alternate; 
                                loop: true; 
                                easing: linear">
            </a-sphere>
        </a-entity>
        
        <!-- FINAL BOSS -->
        <a-entity id="bossContainer" visible="false" position="0 2 -8">
            <!-- Boss Main Body -->
            <a-sphere id="bossCore" 
                      class="boss" 
                      radius="1.5" 
                      color="darkred"
                      animation__pulse="property: scale; 
                                       to: 1.2 1.2 1.2; 
                                       dur: 1000; 
                                       dir: alternate; 
                                       loop: true; 
                                       easing: easeInOutSine">
            </a-sphere>
            
            <!-- Boss Eyes -->
            <a-sphere position="-0.4 0.3 1.2" 
                      radius="0.2" 
                      color="red"
                      animation="property: material.emissive; 
                                to: red; 
                                dur: 500; 
                                dir: alternate; 
                                loop: true">
            </a-sphere>
            <a-sphere position="0.4 0.3 1.2" 
                      radius="0.2" 
                      color="red"
                      animation="property: material.emissive; 
                                to: red; 
                                dur: 500; 
                                dir: alternate; 
                                loop: true">
            </a-sphere>
            
            <!-- Boss Armor Plates -->
            <a-box class="boss" 
                   position="-1.5 0 0" 
                   width="0.5" 
                   height="2" 
                   depth="0.5" 
                   color="gray"
                   animation="property: rotation; 
                             to: 0 360 0; 
                             dur: 3000; 
                             loop: true">
            </a-box>
            <a-box class="boss" 
                   position="1.5 0 0" 
                   width="0.5" 
                   height="2" 
                   depth="0.5" 
                   color="gray"
                   animation="property: rotation; 
                             to: 0 -360 0; 
                             dur: 3000; 
                             loop: true">
            </a-box>
            
            <!-- Boss Weak Points -->
            <a-sphere class="boss weakpoint" 
                      position="0 0.8 1.3" 
                      radius="0.3" 
                      color="yellow"
                      animation="property: material.emissive; 
                                to: yellow; 
                                dur: 800; 
                                dir: alternate; 
                                loop: true">
            </a-sphere>
            <a-sphere class="boss weakpoint" 
                      position="0 -0.8 1.3" 
                      radius="0.3" 
                      color="yellow"
                      animation="property: material.emissive; 
                                to: yellow; 
                                dur: 800; 
                                dir: alternate; 
                                loop: true">
            </a-sphere>
        </a-entity>
        
        <!-- Score and info display -->
        <a-text id="score" 
                position="-3 4.5 -3" 
                value="Score: 0" 
                color="white" 
                scale="1.5 1.5 1.5">
        </a-text>
        
        <a-text id="combo" 
                position="1 4.5 -3" 
                value="Combo: 0" 
                color="yellow" 
                scale="1.2 1.2 1.2">
        </a-text>
        
        <a-text id="bossHealth" 
                position="0 4.5 -3" 
                value="" 
                color="red" 
                scale="1.5 1.5 1.5"
                visible="false">
        </a-text>
        
        <a-text id="gameStatus" 
                position="0 3.8 -3" 
                value="" 
                color="white" 
                scale="1.2 1.2 1.2"
                align="center">
        </a-text>
        
        <!-- Instructions -->
        <a-text position="-2 -1 -2" 
                value="Look at targets to shoot!\nGreen=10pts, Orange=20pts, Red=30pts\nPurple Ring=40pts, Gold=50pts" 
                color="cyan" 
                scale="0.8 0.8 0.8"
                align="center">
        </a-text>
    </a-scene>
    
    <script>
        let score = 0;
        let combo = 0;
        let comboTimer = null;
        let gameStarted = false;
        let circleInterval = null;
        let bossActive = false;
        let bossHealth = 10;
        let maxBossHealth = 10;
        
        // Start button functionality
        document.getElementById('startButton').addEventListener('click', function() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScene').style.display = 'block';
            gameStarted = true;
            startGame();
        });
        
        function startGame() {
            // Start the circular target rotation
            circleInterval = setInterval(() => {
                const circleTarget = document.querySelector('#circleTarget');
                if (circleTarget) {
                    const currentRotation = circleTarget.getAttribute('rotation').y;
                    circleTarget.setAttribute('rotation', `0 ${currentRotation + 2} 0`);
                }
            }, 50);
        }
        
        function spawnBoss() {
            bossActive = true;
            bossHealth = maxBossHealth;
            
            // Hide regular targets
            document.getElementById('regularTargets').setAttribute('visible', false);
            
            // Show boss
            document.getElementById('bossContainer').setAttribute('visible', true);
            
            // Change sky to boss battle
            document.getElementById('gameSky').setAttribute('color', '#440000');
            
            // Show boss health
            document.getElementById('bossHealth').setAttribute('visible', true);
            updateBossHealth();
            
            // Show boss message
            document.getElementById('gameStatus').setAttribute('value', '🔥 FINAL BOSS BATTLE! 🔥\nHit the YELLOW weak points!');
            
            // Make boss move around
            startBossMovement();
        }
        
        function startBossMovement() {
            const boss = document.getElementById('bossContainer');
            boss.setAttribute('animation__move', 
                'property: position; to: 3 2 -6; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine');
            boss.setAttribute('animation__sway', 
                'property: rotation; to: 0 30 0; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine');
        }
        
        function updateBossHealth() {
            const healthPercent = Math.round((bossHealth / maxBossHealth) * 100);
            document.getElementById('bossHealth').setAttribute('value', `Boss Health: ${bossHealth}/${maxBossHealth} (${healthPercent}%)`);
        }
        
        function defeatBoss() {
            bossActive = false;
            document.getElementById('bossContainer').setAttribute('visible', false);
            document.getElementById('bossHealth').setAttribute('visible', false);
            document.getElementById('gameSky').setAttribute('color', '#001122');
            document.getElementById('gameStatus').setAttribute('value', '🎉 VICTORY! YOU DEFEATED THE BOSS! 🎉\nFinal Score: ' + score);
            
            // Add victory bonus
            score += 500;
            document.querySelector('#score').setAttribute('value', 'Score: ' + score);
        }
        
        // Create hit sound effect using Web Audio API
        function playHitSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.5
