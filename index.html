<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Sky background -->
        <a-sky color="#87CEEB"></a-sky>
        
        <!-- Easy target - slow and large -->
        <a-sphere 
            id="easy-target"
            position="0 2 -5" 
            radius="0.8" 
            color="green"
            animation="property: position; to: 3 2 -5; dur: 5000; dir: alternate; loop: true"
            class="clickable easy">
        </a-sphere>
        
        <!-- Medium target - medium speed and size -->
        <a-sphere 
            id="medium-target"
            position="-2 3 -6" 
            radius="0.5" 
            color="yellow"
            animation="property: position; to: 2 1 -6; dur: 3000; dir: alternate; loop: true"
            class="clickable medium">
        </a-sphere>
        
        <!-- Hard target - fast and small -->
        <a-sphere 
            id="hard-target"
            position="1 1.5 -7" 
            radius="0.3" 
            color="red"
            animation="property: position; to: -3 3.5 -7; dur: 1500; dir: alternate; loop: true"
            class="clickable hard">
        </a-sphere>
        
        <!-- Shrinking target - changes size -->
        <a-sphere 
            id="shrinking-target"
            position="0 4 -8" 
            radius="0.6" 
            color="purple"
            animation__move="property: position; to: 4 1 -8; dur: 4000; dir: alternate; loop: true"
            animation__shrink="property: radius; to: 0.2; dur: 2000; dir: alternate; loop: true"
            class="clickable shrinking">
        </a-sphere>
        
        <!-- Moving ring target - different shape -->
        <a-torus 
            id="ring-target"
            position="-3 2.5 -6" 
            radius="0.5" 
            radius-tubular="0.1"
            color="orange"
            animation="property: rotation; to: 0 360 0; dur: 2000; loop: true"
            animation__move="property: position; to: 3 2.5 -6; dur: 3500; dir: alternate; loop: true"
            class="clickable ring">
        </a-torus>
        
        <!-- Score display -->
        <a-text 
            id="score-text"
            position="-2 4 -3" 
            value="Score: 0" 
            color="white" 
            scale="2 2 2">
        </a-text>
        
        <!-- Camera with cursor -->
        <a-camera position="0 1.6 0">
            <a-cursor 
                color="white"
                animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                raycaster="objects: .clickable">
            </a-cursor>
        </a-camera>
    </a-scene>
    
    <script>
        let score = 0;
        const scoreText = document.querySelector('#score-text');
        
        // Point values for different difficulties
        const pointValues = {
            'easy': 10,
            'medium': 20,
            'hard': 50,
            'shrinking': 30,
            'ring': 25
        };
        
        // Add click event listeners to all targets
        document.querySelectorAll('.clickable').forEach(target => {
            target.addEventListener('click', function() {
                // Determine target difficulty
                let difficulty = 'easy';
                if (this.classList.contains('medium')) difficulty = 'medium';
                else if (this.classList.contains('hard')) difficulty = 'hard';
                else if (this.classList.contains('shrinking')) difficulty = 'shrinking';
                else if (this.classList.contains('ring')) difficulty = 'ring';
                
                // Add points based on difficulty
                score += pointValues[difficulty];
                scoreText.setAttribute('value', `Score: ${score}`);
                
                // Target hit effect
                this.setAttribute('visible', false);
                console.log(`${difficulty} target hit! +${pointValues[difficulty]} points`);
                
                // Respawn target after different times based on difficulty
                const respawnTime = difficulty === 'hard' ? 1000 : 
                                  difficulty === 'shrinking' ? 1500 : 2000;
                
                setTimeout(() => {
                    this.setAttribute('visible', true);
                }, respawnTime);
            });
        });
    </script>
</body>
</html>
