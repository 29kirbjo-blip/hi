<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <title>Advanced Target Practice Game</title>
</head>
<body>
    <a-scene>
        <!-- Sky background -->
        <a-sky color="#001122"></a-sky>
        
        <!-- Camera with cursor for aiming -->
        <a-camera>
            <a-cursor color="red" 
                      raycaster="objects: .target"
                      fuse="true" 
                      fuse-timeout="800">
            </a-cursor>
        </a-camera>
        
        <!-- Easy target - slow horizontal movement -->
        <a-sphere class="target" 
                  position="-6 2 -5" 
                  radius="0.5" 
                  color="green"
                  sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                  animation="property: position; 
                            to: 6 2 -5; 
                            dur: 8000; 
                            dir: alternate; 
                            loop: true; 
                            easing: linear">
        </a-sphere>
        
        <!-- Medium target - figure-8 pattern -->
        <a-sphere class="target" 
                  position="0 2 -6" 
                  radius="0.4" 
                  color="orange"
                  sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                  animation__x="property: position; 
                              to: 3 2 -6; 
                              dur: 2000; 
                              dir: alternate; 
                              loop: true; 
                              easing: easeInOutSine"
                  animation__y="property: position; 
                              to: 0 4 -6; 
                              dur: 4000; 
                              dir: alternate; 
                              loop: true; 
                              easing: easeInOutSine">
        </a-sphere>
        
        <!-- Hard target - circular motion + shrinking -->
        <a-entity id="circleTarget" position="0 2 -4">
            <a-sphere class="target" 
                      position="2 0 0" 
                      radius="0.6" 
                      color="red"
                      sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                      animation__shrink="property: radius; 
                                        to: 0.2; 
                                        dur: 3000; 
                                        dir: alternate; 
                                        loop: true; 
                                        easing: linear">
            </a-sphere>
        </a-entity>
        
        <!-- Ring targets that move in different patterns -->
        <a-torus class="target" 
                 position="4 3 -7" 
                 radius="0.5" 
                 radius-tubular="0.1" 
                 color="purple"
                 sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                 animation__bounce="property: position; 
                                   to: 4 1 -7; 
                                   dur: 1500; 
                                   dir: alternate; 
                                   loop: true; 
                                   easing: easeInOutBounce"
                 animation__spin="property: rotation; 
                                 to: 0 360 0; 
                                 dur: 2000; 
                                 loop: true; 
                                 easing: linear">
        </a-torus>
        
        <!-- Bonus fast target -->
        <a-sphere class="target bonus" 
                  position="-4 1 -3" 
                  radius="0.3" 
                  color="gold"
                  sound="src: url(https://www.soundjay.com/misc/sounds/bell_ringing_05.wav); on: click"
                  animation="property: position; 
                            to: 4 4 -8; 
                            dur: 1200; 
                            dir: alternate; 
                            loop: true; 
                            easing: linear">
        </a-sphere>
        
        <!-- Score and info display -->
        <a-text id="score" 
                position="-3 4.5 -3" 
                value="Score: 0" 
                color="white" 
                scale="1.5 1.5 1.5">
        </a-text>
        
        <a-text id="combo" 
                position="1 4.5 -3" 
                value="Combo: 0" 
                color="yellow" 
                scale="1.2 1.2 1.2">
        </a-text>
        
        <!-- Instructions -->
        <a-text position="-2 -1 -2" 
                value="Look at targets to shoot!\nGreen=10pts, Orange=20pts, Red=30pts\nPurple Ring=40pts, Gold=50pts" 
                color="cyan" 
                scale="0.8 0.8 0.8"
                align="center">
        </a-text>
    </a-scene>
    
    <script>
        let score = 0;
        let combo = 0;
        let comboTimer = null;
        
        // Rotate the circular target
        setInterval(() => {
            const circleTarget = document.querySelector('#circleTarget');
            const currentRotation = circleTarget.getAttribute('rotation').y;
            circleTarget.setAttribute('rotation', `0 ${currentRotation + 2} 0`);
        }, 50);
        
        // Create hit sound effect using Web Audio API
        function playHitSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        // Add click event listeners to all targets
        document.querySelectorAll('.target').forEach(target => {
            target.addEventListener('click', function() {
                // Play hit sound
                playHitSound();
                
                // Calculate points based on target type
                let points = 10;
                const color = this.getAttribute('color');
                if (color === 'orange') points = 20;
                else if (color === 'red') points = 30;
                else if (color === 'purple') points = 40;
                else if (color === 'gold') points = 50;
                
                // Combo system
                combo++;
                if (combo > 1) {
                    points *= combo;  // Multiply points by combo
                }
                
                score += points;
                document.querySelector('#score').setAttribute('value', 'Score: ' + score);
                document.querySelector('#combo').setAttribute('value', 'Combo: x' + combo);
                
                // Reset combo timer
                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => {
                    combo = 0;
                    document.querySelector('#combo').setAttribute('value', 'Combo: 0');
                }, 3000);
                
                // Hit effects
                this.setAttribute('scale', '1.5 1.5 1.5');
                this.setAttribute('visible', false);
                
                // Respawn target after delay
                setTimeout(() => {
                    this.setAttribute('visible', true);
                    this.setAttribute('scale', '1 1 1');
                }, 1500);
                
                // Special effect for bonus target
                if (this.classList.contains('bonus')) {
                    this.setAttribute('color', 'white');
                    setTimeout(() => {
                        this.setAttribute('color', 'gold');
                    }, 200);
                }
            });
        });
    </script>
</body>
</html>
