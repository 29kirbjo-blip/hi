<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Sky -->
        <a-sky color="#2C2C2C"></a-sky>
        
        <!-- Player camera -->
        <a-entity id="player" position="0 1.6 3">
            <a-camera look-controls wasd-controls>
                <a-cursor color="white" opacity="0.8" scale="0.5 0.5 0.5"></a-cursor>
            </a-camera>
        </a-entity>
        
        <!-- LEVEL 1: BASIC ROOM (Your original room) -->
        <a-entity id="level1" visible="true">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#8B4513"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -5" rotation="0 0 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="0 2.5 5" rotation="0 180 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="-5 2.5 0" rotation="0 90 0" width="10" height="5" color="#D2B48C"></a-plane>
            <a-plane position="5 2.5 0" rotation="0 -90 0" width="10" height="5" color="#D2B48C"></a-plane>
            
            <!-- Ceiling -->
            <a-plane position="0 5 0" rotation="90 0 0" width="10" height="10" color="#696969"></a-plane>
            
            <!-- Your original puzzle objects -->
            <a-entity id="table" position="2 0 -3">
                <a-box width="2" height="0.8" depth="1" color="#8B4513"></a-box>
                <a-cylinder id="key1" position="0 0.5 0" radius="0.1" height="0.5" color="#FFD700"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                    <a-sphere position="0 0.3 0" radius="0.15" color="#FFD700"></a-sphere>
                </a-cylinder>
            </a-entity>
            
            <a-entity id="chest-area" position="-3 0 -2">
                <a-box id="chest-base" width="1.5" height="0.8" depth="1" color="#654321"></a-box>
                <a-box id="chest-lid" position="0 0.6 -0.2" width="1.6" height="0.3" depth="1.1" color="#8B4513"></a-box>
                <a-cylinder id="chest-lock" position="0 0.5 0.5" radius="0.1" height="0.2" color="#C0C0C0"></a-cylinder>
                <a-cylinder id="scroll1" position="0 1 0" radius="0.1" height="0.8" color="#F5DEB3" visible="false" rotation="90 0 0"></a-cylinder>
            </a-entity>
            
            <a-entity id="bookshelf" position="-4 0 2">
                <a-box width="0.3" height="3" depth="2" color="#8B4513"></a-box>
                <a-box position="0.2 1 -0.5" width="0.2" height="0.3" depth="0.15" color="#FF0000"></a-box>
                <a-box position="0.2 1.4 -0.5" width="0.2" height="0.3" depth="0.15" color="#0000FF"></a-box>
                <a-box position="0.2 1.8 -0.5" width="0.2" height="0.3" depth="0.15" color="#00FF00"></a-box>
                <a-box id="secret-book1" position="0.2 2.2 -0.5" width="0.2" height="0.3" depth="0.15" color="#800080"
                       animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 2000"></a-box>
            </a-entity>
            
            <a-entity id="safe-area" position="4 1 -2">
                <a-box id="safe1" width="1" height="1" depth="0.5" color="#2F4F4F"></a-box>
                <a-box id="safe-door1" position="0 0 0.3" width="0.8" height="0.8" depth="0.1" color="#696969"></a-box>
                <a-text position="0 0.2 0.35" value="1 2 3\n4 5 6\n7 8 9" color="white" scale="0.3 0.3 0.3"></a-text>
                <a-octahedron id="crystal1" position="0 0 0" radius="0.2" color="#00FFFF" visible="false"
                              animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"></a-octahedron>
            </a-entity>
            
            <!-- Portal to Level 2 -->
            <a-entity id="portal1" position="0 1.25 4.9" visible="false">
                <a-cylinder radius="1" height="2.5" color="#00FF00" opacity="0.7"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-cylinder>
                <a-text position="0 0 1.1" value="LEVEL 2" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>

        <!-- LEVEL 2: LABORATORY ROOM -->
        <a-entity id="level2" visible="false">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#2F2F2F"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -6" rotation="0 0 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="0 2.5 6" rotation="0 180 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="-6 2.5 0" rotation="0 90 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="6 2.5 0" rotation="0 -90 0" width="12" height="5" color="#4A4A4A"></a-plane>
            <a-plane position="0 5 0" rotation="90 0 0" width="12" height="12" color="#1A1A1A"></a-plane>
            
            <!-- Lab Equipment -->
            <!-- Color Mixing Station -->
            <a-entity id="lab-table" position="0 0 -4">
                <a-box width="3" height="0.8" depth="1.5" color="#FFFFFF"></a-box>
                <!-- Colored Potions -->
                <a-cylinder id="red-potion" position="-1 0.6 0" radius="0.2" height="0.8" color="#FF0000"
                           animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1500"></a-cylinder>
                <a-cylinder id="blue-potion" position="0 0.6 0" radius="0.2" height="0.8" color="#0000FF"
                           animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1500"></a-cylinder>
                <a-cylinder id="yellow-potion" position="1 0.6 0" radius="0.2" height="0.8" color="#FFFF00"
                           animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1500"></a-cylinder>
                <!-- Mixing Bowl -->
                <a-cylinder id="mixing-bowl" position="0 0.5 -0.7" radius="0.4" height="0.3" color="#C0C0C0"></a-cylinder>
            </a-entity>
            
            <!-- Computer Terminal -->
            <a-entity id="computer" position="3 1 -3">
                <a-box width="1" height="0.8" depth="0.1" color="#000000"></a-box>
                <a-text id="computer-screen" position="0 0 0.06" value="ENTER COLOR CODE:\n_ _ _" 
                        color="#00FF00" scale="0.4 0.4 0.4"></a-text>
                <a-box position="0 -0.5 0.2" width="1.2" height="0.2" depth="0.4" color="#808080"></a-box>
            </a-entity>
            
            <!-- Laser Puzzle -->
            <a-entity id="laser-system" position="-3 1 2">
                <a-box width="0.5" height="0.5" depth="0.5" color="#FF0000"></a-box>
                <a-cylinder id="laser-beam" position="0 0 -2" radius="0.05" height="4" color="#FF0000" 
                           rotation="0 0 90" opacity="0.8" visible="false"></a-cylinder>
                <!-- Mirrors -->
                <a-plane id="mirror1" position="0 0 -2" width="0.5" height="0.5" color="#C0C0C0" 
                        rotation="0 45 0"></a-plane>
                <a-plane id="mirror2" position="2 0 -2" width="0.5" height="0.5" color="#C0C0C0" 
                        rotation="0 -45 0"></a-plane>
            </a-entity>
            
            <!-- Portal to Level 3 -->
            <a-entity id="portal2" position="0 1.25 5.9" visible="false">
                <a-cylinder radius="1" height="2.5" color="#FF00FF" opacity="0.7"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-cylinder>
                <a-text position="0 0 1.1" value="LEVEL 3" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>

        <!-- LEVEL 3: SPACE STATION -->
        <a-entity id="level3" visible="false">
            <!-- Floor -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="15" height="15" color="#1a1a2e"></a-plane>
            
            <!-- Walls -->
            <a-plane position="0 2.5 -7.5" rotation="0 0 0" width="15" height="5" color="#16213e"></a-plane>
            <a-plane position="0 2.5 7.5" rotation="0 180 0" width="15" height="5" color="#16213e"></a-plane>
            <a-plane position="-7.5 2.5 0" rotation="0 90 0" width="15" height="5" color="#16213e"></a-plane>
            <a-plane position="7.5 2.5 0" rotation="0 -90 0" width="15" height="5" color="#16213e"></a-plane>
            <a-plane position="0 5 0" rotation="90 0 0" width="15" height="15" color="#0f3460"></a-plane>
            
            <!-- Control Panels -->
            <a-entity id="control-panel1" position="0 1.5 -6">
                <a-box width="3" height="1.5" depth="0.3" color="#2a2a2a"></a-box>
                <a-text position="0 0.3 0.2" value="POWER: OFFLINE" color="#FF0000" scale="0.5 0.5 0.5"></a-text>
                <a-sphere id="power-button" position="-1 -0.3 0.2" radius="0.15" color="#FF0000"
                         animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000"></a-sphere>
            </a-entity>
            
            <!-- Reactor Core -->
            <a-entity id="reactor" position="0 1 0">
                <a-cylinder radius="1.5" height="2" color="#0066cc" opacity="0.3"></a-cylinder>
                <a-sphere id="core" radius="0.8" color="#00ffff" 
                         animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"
                         visible="false"></a-sphere>
            </a-entity>
            
            <!-- Navigation Console -->
            <a-entity id="nav-console" position="4 1 4">
                <a-box width="2" height="1" depth="1" color="#333333"></a-box>
                <a-text position="0 0.2 0.6" value="NAVIGATION\nSTATUS: LOCKED" 
                        color="#FFFF00" scale="0.4 0.4 0.4"></a-text>
                <!-- Direction Buttons -->
                <a-box id="nav-up" position="0 -0.2 0.6" width="0.3" height="0.1" depth="0.3" color="#00FF00"></a-box>
                <a-box id="nav-down" position="0 -0.4 0.6" width="0.3" height="0.1" depth="0.3" color="#00FF00"></a-box>
                <a-box id="nav-left" position="-0.3 -0.3 0.6" width="0.3" height="0.1" depth="0.3" color="#00FF00"></a-box>
                <a-box id="nav-right" position="0.3 -0.3 0.6" width="0.3" height="0.1" depth="0.3" color="#00FF00"></a-box>
            </a-entity>
            
            <!-- Final Portal -->
            <a-entity id="final-portal" position="0 1.25 7" visible="false">
                <a-cylinder radius="1.5" height="3" color="#FFD700" opacity="0.8"
                           animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
                <a-text position="0 0 1.6" value="ESCAPE!" color="white" scale="2 2 2"></a-text>
            </a-entity>
        </a-entity>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#404040"></a-light>
    </script>
</body>
</html>
